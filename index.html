<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIUI Intelligence System | H-10 Campus Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; text-rendering: optimizeLegibility; }
        
        .bg-pattern {
            background-color: #f8fafc;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30z' fill='%23065f46' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        
        .islamic-glow {
            box-shadow: 0 0 50px -10px rgba(6, 95, 70, 0.3);
        }

        .spinner {
            border: 3px solid rgba(6, 95, 70, 0.1);
            border-top: 3px solid #065f46;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #065f46; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-pattern text-slate-900">
    <div id="root">
        <div id="status-container" class="flex flex-col items-center justify-center min-h-screen bg-slate-50">
            <div class="bg-white p-12 rounded-[3rem] shadow-2xl border border-slate-200 flex flex-col items-center max-w-sm text-center islamic-glow">
                <div class="mb-6 relative">
                    <div class="spinner w-12 h-12"></div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <svg class="w-5 h-5 text-emerald-800" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.45l8.27 14.3H3.73L12 5.45z"/></svg>
                    </div>
                </div>
                <h1 class="font-serif text-2xl font-bold text-emerald-900 mb-2">IIUI Intelligence</h1>
                <p id="status-text" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Syncing with H-10 Core...</p>
                <div id="diagnostic-help" class="mt-8 hidden">
                    <p class="text-[10px] text-red-500 font-bold mb-2 uppercase tracking-widest">Initialization Halted</p>
                    <p class="text-[10px] text-slate-500 italic mb-4">Ensure your API_KEY is set in your environment variables.</p>
                    <button onclick="location.reload()" class="px-6 py-2 bg-emerald-800 text-white rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg active:scale-95">Retry Sync</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const diag = document.getElementById('diagnostic-help');
            if (diag && document.getElementById('root').innerHTML.includes('status-container')) {
                diag.classList.remove('hidden');
            }
        }, 6000);
    </script>

    <script type="text/babel" data-type="module" data-presets="typescript,react" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
